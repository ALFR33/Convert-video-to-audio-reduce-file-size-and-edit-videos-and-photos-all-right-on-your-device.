<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>heib12 — محول ومحرر الفيديو والصور</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#eef0f4;--mut:#9aa3b2;--acc:#ff7a3d}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:24px;text-align:center}h1{margin:0;font-size:40px;letter-spacing:2px;color:var(--acc)}header p{color:var(--mut);margin:6px 0 0}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
nav button{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:bold}
main{max-width:820px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:none}.card.on{display:block}
h2{margin-top:0}label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f1115;color:var(--txt);font:inherit}
input[type=range]{padding:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#111;font:inherit;font-weight:bold;cursor:pointer}
.go:disabled{opacity:.5}.small{display:inline-block;width:auto;margin:4px;padding:8px 12px;background:#262b36;color:var(--txt)}
video,img,canvas{max-width:100%;border-radius:10px;margin-top:12px;display:block}
.st{margin-top:12px;color:var(--mut);font-size:14px}a.dl{display:inline-block;margin-top:12px;color:var(--acc);font-weight:bold}
</style>
</head>
<body>
<header><h1>heib12</h1><p>حوّل الفيديو لصوت، صغّر الحجم، وعدّل الفيديو والصور — كله داخل جهازك</p></header>
<nav>
<button class="on" data-t="audio">🎵 فيديو إلى صوت</button>
<button data-t="video">🎬 محرر الفيديو والحجم</button>
<button data-t="image">🖼️ محرر الصور</button>
</nav>
<main>
<section class="card on" id="audio"><h2>تحويل الفيديو إلى صوت</h2>
<label>اختر فيديو</label><input type="file" id="aFile" accept="video/*,audio/*">
<button class="go" id="aGo">استخرج الصوت (WAV)</button><div class="st" id="aSt"></div><div id="aOut"></div></section>

<section class="card" id="video"><h2>محرر الفيديو وتصغير الحجم</h2>
<label>اختر فيديو</label><input type="file" id="vFile" accept="video/*">
<video id="vPrev" controls hidden></video>
<div class="row"><div><label>البداية (ثانية)</label><input type="number" id="vStart" value="0" min="0" step="0.1"></div>
<div><label>النهاية (ثانية)</label><input type="number" id="vEnd" value="0" min="0" step="0.1"></div></div>
<div class="row"><div><label>الدقة</label><select id="vScale"><option value="1">الأصلية</option><option value="0.75">75%</option><option value="0.5" selected>50%</option><option value="0.25">25%</option></select></div>
<div><label>الجودة (يحدد الحجم)</label><select id="vBit"><option value="4000000">عالية</option><option value="1500000" selected>متوسطة</option><option value="600000">منخفضة — أصغر حجم</option></select></div></div>
<div class="row"><div><label>السرعة</label><select id="vSpeed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></div>
<div><label>الصوت</label><select id="vMute"><option value="0">مع الصوت</option><option value="1">بدون صوت</option></select></div></div>
<label>فلتر</label><select id="vFilter"><option value="none">بدون</option><option value="grayscale(1)">أبيض وأسود</option><option value="sepia(.8)">قديم</option><option value="contrast(1.3) saturate(1.3)">ألوان قوية</option><option value="brightness(1.25)">أفتح</option></select>
<button class="go" id="vGo" disabled>صدّر الفيديو</button><div class="st" id="vSt"></div><div id="vOut"></div></section>

<section class="card" id="image"><h2>محرر الصور</h2>
<label>اختر صورة</label><input type="file" id="iFile" accept="image/*">
<canvas id="iCan" hidden></canvas>
<div id="iTools" hidden>
<div><button class="go small" data-r="-90">↺ تدوير</button><button class="go small" data-r="90">↻ تدوير</button><button class="go small" id="iFlip">⇋ قلب</button><button class="go small" id="iReset">إعادة</button></div>
<div class="row"><div><label>السطوع</label><input type="range" id="iB" min="0" max="200" value="100"></div><div><label>التباين</label><input type="range" id="iC" min="0" max="200" value="100"></div></div>
<div class="row"><div><label>التشبع</label><input type="range" id="iS" min="0" max="200" value="100"></div><div><label>أبيض وأسود</label><input type="range" id="iG" min="0" max="100" value="0"></div></div>
<div class="row"><div><label>العرض (بكسل)</label><input type="number" id="iW"></div><div><label>الصيغة والجودة</label><select id="iFmt"><option value="image/jpeg|0.9">JPG عالية</option><option value="image/jpeg|0.6">JPG حجم صغير</option><option value="image/png|1">PNG</option><option value="image/webp|0.8">WEBP</option></select></div></div>
<button class="go" id="iGo">احفظ الصورة</button><div class="st" id="iSt"></div><div id="iOut"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const kb=b=>b>1048576?(b/1048576).toFixed(2)+" ميجا":(b/1024).toFixed(0)+" كيلو";
const link=(blob,name,box)=>{const u=URL.createObjectURL(blob);box.innerHTML=`<a class="dl" href="${u}" download="${name}">⬇ تنزيل ${name} (${kb(blob.size)})</a>`;return u};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.card").forEach(e=>e.classList.remove("on"));b.classList.add("on");$(b.dataset.t).classList.add("on")});

// ===== فيديو إلى صوت =====
function wav(buf){const ch=buf.numberOfChannels,len=buf.length*ch*2+44,v=new DataView(new ArrayBuffer(len));let p=0;
const s=t=>{for(const c of t)v.setUint8(p++,c.charCodeAt(0))},u32=x=>{v.setUint32(p,x,true);p+=4},u16=x=>{v.setUint16(p,x,true);p+=2};
s("RIFF");u32(len-8);s("WAVEfmt ");u32(16);u16(1);u16(ch);u32(buf.sampleRate);u32(buf.sampleRate*ch*2);u16(ch*2);u16(16);s("data");u32(len-44);
const d=[...Array(ch)].map((_,i)=>buf.getChannelData(i));for(let i=0;i<buf.length;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}
return new Blob([v],{type:"audio/wav"})}
$("aGo").onclick=async()=>{const f=$("aFile").files[0];if(!f)return $("aSt").textContent="اختر ملف أول.";
$("aSt").textContent="جاري الاستخراج...";$("aOut").innerHTML="";
try{const ctx=new AudioContext();const buf=await ctx.decodeAudioData(await f.arrayBuffer());const b=wav(buf);
const u=link(b,f.name.replace(/\.[^.]+$/,"")+".wav",$("aOut"));$("aOut").insertAdjacentHTML("beforeend",`<audio controls src="${u}" style="width:100%;margin-top:10px"></audio>`);
$("aSt").textContent="تم ✅ المدة: "+buf.duration.toFixed(1)+" ثانية"}catch(e){$("aSt").textContent="ما قدرت أقرأ الصوت من هذا الملف. جرّب فيديو MP4."}};

// ===== محرر الفيديو =====
const vp=$("vPrev");
$("vFile").onchange=()=>{const f=$("vFile").files[0];if(!f)return;vp.src=URL.createObjectURL(f);vp.hidden=false;
vp.onloadedmetadata=()=>{$("vEnd").value=vp.duration.toFixed(1);$("vGo").disabled=false;$("vSt").textContent=`الحجم الأصلي: ${kb(f.size)} — ${vp.videoWidth}×${vp.videoHeight}`}};
$("vGo").onclick=async()=>{const st=+$("vStart").value,en=Math.min(+$("vEnd").value,vp.duration),sc=+$("vScale").value,sp=+$("vSpeed").value;
if(en<=st)return $("vSt").textContent="النهاية لازم تكون بعد البداية.";
$("vGo").disabled=true;$("vOut").innerHTML="";
const c=document.createElement("canvas");c.width=Math.round(vp.videoWidth*sc/2)*2;c.height=Math.round(vp.videoHeight*sc/2)*2;const x=c.getContext("2d");
const stream=c.captureStream(30);
if($("vMute").value==="0"){try{const ac=new AudioContext(),src=ac.createMediaElementSource(vp),dst=ac.createMediaStreamDestination();src.connect(dst);vp._ac=ac;dst.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){}}
const mime=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(m=>MediaRecorder.isTypeSupported(m));
const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:+$("vBit").value});const parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
rec.onstop=()=>{const b=new Blob(parts,{type:mime.split(";")[0]});const ext=mime.includes("mp4")?"mp4":"webm";const u=link(b,"heib12-video."+ext,$("vOut"));
$("vOut").insertAdjacentHTML("beforeend",`<video controls src="${u}"></video>`);$("vSt").textContent="تم ✅ الحجم الجديد: "+kb(b.size);$("vGo").disabled=false};
vp.currentTime=st;await new Promise(r=>vp.onseeked=r);vp.playbackRate=sp;vp.muted=false;
const draw=()=>{x.filter=$("vFilter").value;x.drawImage(vp,0,0,c.width,c.height);
$("vSt").textContent="جاري التصدير... "+Math.round((vp.currentTime-st)/(en-st)*100)+"%";
if(vp.currentTime>=en||vp.ended){vp.pause();rec.stop();return}requestAnimationFrame(draw)};
rec.start(200);await vp.play();draw()};

// ===== محرر الصور =====
let img=null,rot=0,flip=1;const cv=$("iCan"),cx=cv.getContext("2d");
function drawImg(){if(!img)return;const sw=rot%180?img.height:img.width,sh=rot%180?img.width:img.height;const w=+$("iW").value||sw,h=Math.round(sh*w/sw);
cv.width=w;cv.height=h;cx.filter=`brightness(${$("iB").value}%) contrast(${$("iC").value}%) saturate(${$("iS").value}%) grayscale(${$("iG").value}%)`;
cx.save();cx.translate(w/2,h/2);cx.rotate(rot*Math.PI/180);cx.scale(flip,1);const k=w/sw;cx.drawImage(img,-img.width*k/2,-img.height*k/2,img.width*k,img.height*k);cx.restore()}
$("iFile").onchange=()=>{const f=$("iFile").files[0];if(!f)return;img=new Image();img.onload=()=>{rot=0;flip=1;$("iW").value=img.width;cv.hidden=false;$("iTools").hidden=false;$("iSt").textContent="الحجم الأصلي: "+kb(f.size);drawImg()};img.src=URL.createObjectURL(f)};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rot=(rot+ +b.dataset.r+360)%360;$("iW").value=rot%180?img.height:img.width;drawImg()});
$("iFlip").onclick=()=>{flip*=-1;drawImg()};
$("iReset").onclick=()=>{rot=0;flip=1;["iB","iC","iS"].forEach(i=>$(i).value=100);$("iG").value=0;$("iW").value=img.width;drawImg()};
["iB","iC","iS","iG","iW"].forEach(i=>$(i).oninput=drawImg);
$("iGo").onclick=()=>{const [t,q]=$("iFmt").value.split("|");cv.toBlob(b=>{link(b,"heib12-image."+t.split("/")[1].replace("jpeg","jpg"),$("iOut"));$("iSt").textContent="تم ✅ الحجم الجديد: "+kb(b.size)},t,+q)};
</script>
</body>
</html>
